name: Compilar APK Android SuperSoria

on:
  workflow_dispatch: # Permite compilar el APK con 1 clic desde GitHub
  push:
    branches:
      - master
    tags:
      - 'v*' # Compila automáticamente cuando se crea una etiqueta de versión (ej. v1.0.0)

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar SuperSoria.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Sincronizar Plataforma Android de Capacitor
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SuperSoria.apk

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: SuperSoria-Android-APK
          path: SuperSoria.apk
          retention-days: 30

      - name: Publicar APK en GitHub Releases (si es tag o release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SuperSoria.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
